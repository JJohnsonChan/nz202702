            onclick="switchDay(${item.day})"
            class="px-3 py-1.5 rounded-lg whitespace-nowrap transition flex items-center gap-1 text-xs sm:text-sm ${
              isActive 
                ? 'bg-emerald-500 text-white font-bold shadow' 
                : 'text-emerald-100 hover:bg-emerald-800/50'
            }">
            <span>Day ${item.day}</span>
          </button>
        `;
      }).join('');
    }

              <i class="fa-solid fa-triangle-exclamation"></i> 駕駛與注意事項提醒
            </div>
            <ul class="list-disc list-inside space-y-1 text-amber-800/90">
              <li>紐西蘭為左側通行（右駕），請特別注意圓環（Roundabout）讓右側來車優先原則。</li>
              <li>南島山區道路多單向橋樑（Give Way 標誌），請依優先權箭頭標示讓行。</li>
              <li>請隨時保持油箱半滿以上狀態，山區加油站間距較遠。</li>
            </ul>
          </div>
        </div>
      `;
    }

    function switchDay(day) {
      activeDay = day;
      renderTabs();
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize Page
    renderTabs();
    renderContent();
  </script>
</body>
